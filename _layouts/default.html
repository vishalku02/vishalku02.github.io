<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <link rel="stylesheet" href="{{ '/assets/css/tufte.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
</head>
<body>
  <article>
    {% if page.title %}<p><a href="{{ '/' | relative_url }}">&larr; {{ site.title }}</a></p>{% endif %}
    {% if page.home %}<h1>{{ site.title }}</h1>{% endif %}
    {{ content }}
    <section>
      <p class="footer">
        You can also find me on
        {% if site.linkedin %}<a href="https://www.linkedin.com/in/{{ site.linkedin }}">LinkedIn</a>{% endif %}
        {% if site.github %}and <a href="https://github.com/{{ site.github }}">GitHub</a>{% endif %}.
        This site is inspired by <a href="https://kunhanda.github.io/">kunhanda.github.io</a>.
      </p>
    </section>
  </article>
</body>
</html>
